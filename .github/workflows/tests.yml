name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test,array-api,typecheck]' -r tests/array-api-requirements.txt
      - run: python scripts/check-types.py
      - run: python -m pytest -q
      - run: sh scripts/check-array-api.sh -q --json-report --json-report-file="$GITHUB_WORKSPACE/array-api-report.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: array-api-${{ matrix.os }}-${{ matrix.python }}
          path: array-api-report.json
  immune-adapters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -e './packages/tightarray-immune[test]'
      - run: python -m mypy --strict packages/tightarray-immune/src
      - run: python -m pytest -q packages/tightarray-immune/tests
  numba-grid:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,numba]' 'cellpylib @ git+https://github.com/lantunes/cellpylib.git@743e936d48f8520f6f4ac652570ac7bb46414189'
      - run: python -m pytest -q tests/test_numba.py tests/test_lattice.py tests/test_cellpylib_backend.py tests/test_cellpylib_multistate.py tests/test_capacity_grid.py
  storage-pilots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,numba]' 'blosc2==4.13.1' 'scikit-allel==1.3.13'
      - run: python -m pytest -q tests/test_explore_replay.py tests/test_explore_labels.py tests/test_explore_genotypes.py tests/test_explore_edits.py
  nonbio-pilots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' 'blosc2==4.13.1' 'minigrid==3.1.0' 'pygame-ce==2.5.8' 'Pillow==12.3.0'
      - run: |
          mkdir -p /tmp/tightarray-sokoban-source
          curl --fail --location https://raw.githubusercontent.com/mpSchrader/gym-sokoban/8e06e44e8bf3bb8bc73eeb1e7f0354508ce3fc89/gym_sokoban/envs/room_utils.py --output /tmp/tightarray-sokoban-source/room_utils.py
      - run: python -m pytest -q tests/test_real_minigrid_replay.py tests/test_real_minigrid_grid.py tests/test_real_sprite_audit.py tests/test_real_sokoban_search.py
