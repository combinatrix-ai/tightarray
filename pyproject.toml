[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tightarray"
version = "0.1.0.dev0"
description = "Compact small-integer arrays for CPython"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
numpy = ["numpy>=2"]
numba = ["numba>=0.61", "numpy>=2"]
compression = ["blosc2>=4"]
array-api = ["numpy>=2.5"]
test = ["pytest>=8", "numpy>=2"]
typecheck = ["mypy==2.3.1", "numpy>=2.5", "setuptools>=77", "wheel>=0.45"]
bench = ["numpy>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
